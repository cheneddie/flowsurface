name: Pro Order Flow Drawing Compile Fix

on:
  push:
    branches:
      - feature/pro-orderflow-platform
    paths:
      - scripts/pro_orderflow_fix_drawing_compile.py
      - .github/workflows/pro-orderflow-drawing-compile-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pro-orderflow-platform
          fetch-depth: 0
      - name: Apply compile fix
        run: python3 scripts/pro_orderflow_fix_drawing_compile.py
      - name: Read rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Drawing compile fix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/chart/drawing_overlay.rs
          git commit -m "fix(drawing): align with iced 0.14"
          git pull --rebase origin feature/pro-orderflow-platform
          git push origin HEAD:feature/pro-orderflow-platform
