name: Pro Order Flow Heatmap Integration

on:
  push:
    branches:
      - feature/pro-orderflow-platform
    paths:
      - scripts/pro_orderflow_patch_heatmap.py
      - .github/workflows/pro-orderflow-heatmap-integrate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pro-orderflow-platform
          fetch-depth: 0

      - name: Apply deterministic Heatmap integration
        run: python3 scripts/pro_orderflow_patch_heatmap.py

      - name: Read rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          components: rustfmt

      - name: Format
        run: cargo fmt --all

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Heatmap integration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/chart/heatmap.rs
          git commit -m "feat(heatmap): integrate live book speed"
          git pull --rebase origin feature/pro-orderflow-platform
          git push origin HEAD:feature/pro-orderflow-platform
